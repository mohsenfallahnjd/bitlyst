name: Cross-post to dev.to

on:
  push:
    branches: [main]
    paths: ["docs/*.mdx", "docs/*.md"]
  workflow_dispatch:
    inputs:
      slugs:
        description: "Post slugs to sync, space-separated (e.g. javascript-closures cors-explained-simple)"
        required: true
      publish:
        description: "Publish new articles immediately (otherwise created as drafts)"
        type: boolean
        default: false

concurrency:
  group: devto
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Find changed posts
        id: posts
        env:
          INPUT_SLUGS: ${{ inputs.slugs }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_SLUGS" ]; then
            echo "list=$INPUT_SLUGS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # first push of a branch has no "before" commit
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'docs/*.mdx' 'docs/*.md' | grep -v '^docs/_' | tr '\n' ' ')
          echo "list=$files" >> "$GITHUB_OUTPUT"

      - name: Sync to dev.to
        if: steps.posts.outputs.list != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_PUBLISH: ${{ inputs.publish || vars.DEVTO_PUBLISH || 'false' }}
          POSTS: ${{ steps.posts.outputs.list }}
        # word-splitting $POSTS into separate args is intended
        run: bun scripts/devto.ts $POSTS
